<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — AVIAKASSA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="main-header">
    <div class="container header-content">
        <a href="index.html" class="logo">✈ AVIAKASSA</a>
        <nav class="main-nav">
            <a href="index.html">Главная</a>
            <a href="flights.html">Рейсы</a>
            <a href="orders.html">Мои билеты</a>
            <a href="profile.html" class="active">Профиль</a>
        </nav>
        <div class="header-actions" id="loginContainer"></div>
    </div>
</header>

<section class="page-hero">
    <div class="container page-hero-content">
        <h1>Личный кабинет</h1>
        <p>Управляйте своими билетами и настройками аккаунта</p>
    </div>
</section>

<section class="profile-content-section">
    <div class="container">
        <div id="profileContainer"></div>
    </div>
</section>

<footer class="footer">
    <div class="container footer-content">
        <div class="footer-left">
            <div class="footer-logo">✈ AVIAKASSA</div>
            <p>Современный сервис поиска и бронирования авиабилетов.</p>
        </div>
        <div class="footer-links">
            <a href="index.html">Главная</a>
            <a href="flights.html">Рейсы</a>
            <a href="orders.html">Билеты</a>
            <a href="profile.html">Профиль</a>
        </div>
    </div>
</footer>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script>
    async function loadProfile() {
        const token = localStorage.getItem('token');
        const container = document.getElementById('profileContainer');
        
        if (!token) {
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: rgba(255,255,255,.05); border-radius: 30px;">
                    <i class="fas fa-lock" style="font-size: 64px; color: rgba(255,255,255,.3); margin-bottom: 20px;"></i>
                    <h3 style="margin-bottom: 15px;">Требуется авторизация</h3>
                    <p style="margin-bottom: 30px; color: rgba(255,255,255,.6);">Войдите, чтобы просмотреть профиль</p>
                    <div style="display: flex; gap: 15px; justify-content: center;">
                        <a href="auth.html" class="secondary-btn">Войти</a>
                        <a href="flights.html" class="main-btn">Найти билеты</a>
                    </div>
                </div>
            `;
            return;
        }
        
        try {
            const [profileRes, ordersRes] = await Promise.all([
                fetch('/api/auth/profile', { headers: { 'Authorization': `Bearer ${token}` } }),
                fetch('/api/auth/orders', { headers: { 'Authorization': `Bearer ${token}` } })
            ]);
            
            const user = await profileRes.json();
            const orders = await ordersRes.json();
            
            const totalSpent = orders.reduce((sum, o) => sum + o.TotalPrice, 0);
            const nameParts = (user.FullName || '').split(' ');
            const firstName = nameParts[0] || '';
            const lastName = nameParts.slice(1).join(' ') || '';
            
            container.innerHTML = `
                <!-- Шапка профиля -->
                <div style="background: linear-gradient(135deg, rgba(77,184,255,.1), rgba(109,125,255,.05)); border-radius: 30px; padding: 30px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,.08);">
                    <div style="display: flex; align-items: center; gap: 25px; flex-wrap: wrap;">
                        <div style="width: 100px; height: 100px; background: linear-gradient(135deg, #4db8ff, #6d7dff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold;">
                            ${user.FullName?.charAt(0) || '?'}
                        </div>
                        <div>
                            <h1 style="font-size: 32px; margin-bottom: 8px;">${user.FullName || 'Пользователь'}</h1>
                            <p style="color: rgba(255,255,255,.6); margin-bottom: 5px;"><i class="fas fa-envelope"></i> ${user.Email}</p>
                            <p style="color: rgba(255,255,255,.6);"><i class="fas fa-phone"></i> ${user.Phone || 'Телефон не указан'}</p>
                        </div>
                    </div>
                </div>
                
                <!-- Статистика -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
                    <div style="background: rgba(255,255,255,.05); border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,.08);">
                        <i class="fas fa-ticket-alt" style="font-size: 32px; color: #4db8ff; margin-bottom: 10px;"></i>
                        <h2 style="font-size: 36px;">${orders.length}</h2>
                        <p style="color: rgba(255,255,255,.6);">Перелётов</p>
                    </div>
                    <div style="background: rgba(255,255,255,.05); border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,.08);">
                        <i class="fas fa-ruble-sign" style="font-size: 32px; color: #4db8ff; margin-bottom: 10px;"></i>
                        <h2 style="font-size: 36px;">${totalSpent.toLocaleString()}</h2>
                        <p style="color: rgba(255,255,255,.6);">Потрачено</p>
                    </div>
                    <div style="background: rgba(255,255,255,.05); border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,.08);">
                        <i class="fas fa-star" style="font-size: 32px; color: #4db8ff; margin-bottom: 10px;"></i>
                        <h2 style="font-size: 36px;">${orders.length * 100}</h2>
                        <p style="color: rgba(255,255,255,.6);">Бонусов</p>
                    </div>
                </div>
                
                <!-- Форма редактирования -->
                <div style="background: rgba(255,255,255,.05); border-radius: 30px; padding: 35px; border: 1px solid rgba(255,255,255,.08);">
                    <h2 style="margin-bottom: 25px; display: flex; align-items: center; gap: 10px;"><i class="fas fa-user-edit" style="color: #4db8ff;"></i> Редактирование профиля</h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px;">
                        <div>
                            <label style="display: block; margin-bottom: 8px;"><i class="fas fa-user"></i> Имя</label>
                            <input type="text" id="fullName" value="${escapeHtml(firstName)}" placeholder="Введите имя" style="width: 100%; padding: 14px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: white; font-size: 16px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px;"><i class="fas fa-user-tag"></i> Фамилия</label>
                            <input type="text" id="lastName" value="${escapeHtml(lastName)}" placeholder="Введите фамилию" style="width: 100%; padding: 14px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: white; font-size: 16px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px;"><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="email" value="${escapeHtml(user.Email)}" readonly style="width: 100%; padding: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.05); border-radius: 12px; color: rgba(255,255,255,.5); font-size: 16px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px;"><i class="fas fa-phone"></i> Телефон</label>
                            <input type="text" id="phone" value="${escapeHtml(user.Phone || '')}" placeholder="+7 (999) 999-99-99" style="width: 100%; padding: 14px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: white; font-size: 16px;">
                        </div>
                    </div>
                    <button id="saveProfileBtn" style="margin-top: 30px; background: linear-gradient(135deg, #4db8ff, #6d7dff); border: none; padding: 14px 32px; border-radius: 50px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s;">💾 Сохранить изменения</button>
                </div>
            `;
            
            document.getElementById('saveProfileBtn')?.addEventListener('click', async () => {
                const firstName = document.getElementById('fullName').value;
                const lastName = document.getElementById('lastName').value;
                const fullName = `${firstName} ${lastName}`.trim();
                const phone = document.getElementById('phone').value;
                
                if (!fullName) {
                    alert('Введите имя');
                    return;
                }
                
                const res = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ fullName, phone })
                });
                const data = await res.json();
                if (data.success) {
                    const userData = JSON.parse(localStorage.getItem('user') || '{}');
                    userData.FullName = fullName;
                    localStorage.setItem('user', JSON.stringify(userData));
                    if (typeof checkAuth === 'function') checkAuth();
                    alert('✅ Профиль обновлён!');
                    loadProfile();
                } else {
                    alert('❌ Ошибка обновления');
                }
            });
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div style="text-align:center; padding:60px;">Ошибка загрузки профиля</div>';
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    loadProfile();
</script>
</body>
</html>
