<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — AVIAKASSA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cart-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .cart-header { text-align: center; margin-bottom: 40px; }
        .cart-header h1 { font-size: 42px; margin-bottom: 10px; background: linear-gradient(135deg, #fff, #4db8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .timer-wrapper { display: flex; justify-content: center; margin-bottom: 40px; }
        .timer-card { background: linear-gradient(135deg, rgba(77,184,255,.15), rgba(109,125,255,.1)); border: 1px solid rgba(77,184,255,.3); border-radius: 60px; padding: 12px 30px; display: inline-flex; align-items: center; gap: 15px; }
        .timer-card i { font-size: 28px; color: #4db8ff; }
        #cartTimer { font-size: 28px; font-weight: bold; font-family: monospace; color: #4db8ff; }
        .cart-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .cart-item { background: linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.08); border-radius: 28px; padding: 24px; transition: all 0.3s ease; }
        .cart-item:hover { transform: translateY(-3px); border-color: rgba(77,184,255,.3); }
        .item-main { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .item-airline { display: flex; align-items: center; gap: 15px; }
        .airline-icon { width: 55px; height: 55px; background: linear-gradient(135deg, #4db8ff, #6d7dff); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .item-info h3 { font-size: 20px; margin-bottom: 5px; }
        .item-price .price-value { font-size: 32px; font-weight: bold; color: #4db8ff; }
        .item-details { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.08); }
        .quantity-control { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.08); padding: 5px 15px; border-radius: 40px; }
        .quantity-control button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px 10px; }
        .quantity-control button:hover { color: #4db8ff; }
        .remove-btn { background: rgba(255,107,107,.15); border: 1px solid rgba(255,107,107,.3); color: #ff6b6b; padding: 10px 20px; border-radius: 40px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .cart-summary-card { background: linear-gradient(135deg, rgba(77,184,255,.1), rgba(109,125,255,.05)); border: 1px solid rgba(77,184,255,.2); border-radius: 30px; padding: 30px; margin-top: 30px; }
        .summary-row.total { border-top: 1px solid rgba(255,255,255,.1); margin-top: 10px; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .summary-row.total .value { font-size: 36px; font-weight: bold; color: #4db8ff; }
        .cart-actions { display: flex; gap: 20px; margin-top: 30px; }
        .cart-actions a { flex: 1; text-align: center; }
        .empty-cart { text-align: center; padding: 80px 20px; background: rgba(255,255,255,.05); border-radius: 40px; }
        .empty-cart i { font-size: 80px; color: rgba(255,255,255,.2); margin-bottom: 20px; }
        @media (max-width: 768px) { .item-main, .item-details { flex-direction: column; text-align: center; } .cart-actions { flex-direction: column; } }
    </style>
</head>
<body>

<header class="main-header">
    <div class="container header-content">
        <a href="index.html" class="logo">✈ AVIAKASSA</a>
        <nav class="main-nav">
            <a href="index.html">Главная</a>
            <a href="flights.html">Рейсы</a>
            <a href="cart.html" class="active">Корзина</a>
            <a href="orders.html">Мои билеты</a>
            <a href="profile.html">Профиль</a>
        </nav>
        <div class="header-actions" id="loginContainer">
            <a href="auth.html" class="secondary-btn">Войти</a>
            <a href="auth.html?tab=register" class="main-btn">Регистрация</a>
        </div>
    </div>
</header>

<div class="cart-container">
    <div class="cart-header">
        <h1><i class="fas fa-shopping-cart"></i> Моя корзина</h1>
        <p>Проверьте выбранные билеты перед оплатой</p>
    </div>
    <div id="cartContent"></div>
</div>

<footer class="footer">
    <div class="container footer-content">
        <div class="footer-left"><div class="footer-logo">✈ AVIAKASSA</div><p>Современный сервис поиска и бронирования авиабилетов.</p></div>
        <div class="footer-links"><a href="index.html">Главная</a><a href="flights.html">Рейсы</a><a href="orders.html">Билеты</a><a href="profile.html">Профиль</a></div>
    </div>
</footer>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
    function getCart() {
        const cartJson = localStorage.getItem('aviakassa_cart');
        return cartJson ? JSON.parse(cartJson) : { items: [], total: 0, expiresAt: null };
    }
    
    function saveCart(cart) {
        localStorage.setItem('aviakassa_cart', JSON.stringify(cart));
    }
    
    let cartTimerInterval = null;
    
    function initCartTimer() {
        const timerEl = document.getElementById('cartTimer');
        if (!timerEl) return;
        if (cartTimerInterval) clearInterval(cartTimerInterval);
        cartTimerInterval = setInterval(() => {
            const cart = getCart();
            if (!cart.expiresAt || !cart.items.length) {
                timerEl.textContent = '--:--';
                return;
            }
            const diff = new Date(cart.expiresAt) - new Date();
            if (diff <= 0) {
                localStorage.removeItem('aviakassa_cart');
                timerEl.textContent = '00:00';
                if (typeof showNotification === 'function') showNotification('⏰ Время бронирования истекло! Корзина очищена.');
                renderCart();
                if (cartTimerInterval) clearInterval(cartTimerInterval);
                return;
            }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }, 1000);
    }
    
    window.updateQuantity = function(flightId, delta) {
        let cart = getCart();
        const item = cart.items.find(i => i.id === flightId);
        if (item) {
            const newQty = item.quantity + delta;
            if (newQty <= 0) {
                cart.items = cart.items.filter(i => i.id !== flightId);
                if (typeof showRemoveNotification === 'function') showRemoveNotification('Рейс удалён');
                else if (typeof showNotification === 'function') showNotification('🗑️ Рейс удалён');
            } else if (newQty <= 9) {
                item.quantity = newQty;
            }
            if (!cart.items.length) cart.expiresAt = null;
            cart.total = cart.items.reduce((sum, i) => sum + i.price * i.quantity, 0);
            saveCart(cart);
            renderCart();
            if (typeof updateCartCount === 'function') updateCartCount();
        }
    };
    
    function parseFlightName(name) {
        const match = name.match(/(.+?): (.+?) → (.+)/);
        if (match) return { airline: match[1], from: match[2], to: match[3] };
        return { airline: name, from: '?', to: '?' };
    }
    
    function renderCart() {
        const container = document.getElementById('cartContent');
        const cart = getCart();
        
        if (!cart.items.length) {
            container.innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <h2>Корзина пуста</h2>
                    <p>Добавьте авиабилеты, чтобы продолжить бронирование</p>
                    <a href="flights.html" class="main-btn">Найти билеты</a>
                </div>
            `;
            return;
        }
        
        let itemsHtml = '';
        cart.items.forEach(item => {
            const parsed = parseFlightName(item.name);
            const totalItemPrice = item.price * item.quantity;
            itemsHtml += `
                <div class="cart-item">
                    <div class="item-main">
                        <div class="item-airline">
                            <div class="airline-icon">${parsed.airline.charAt(0)}</div>
                            <div class="item-info">
                                <h3>${parsed.airline}</h3>
                                <p>${parsed.from} → ${parsed.to}</p>
                            </div>
                        </div>
                        <div class="item-price">
                            <div class="price-value">${totalItemPrice.toLocaleString()} ₽</div>
                        </div>
                    </div>
                    <div class="item-details">
                        <div class="quantity-control">
                            <button onclick="updateQuantity(${item.id}, -1)">−</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="window.removeFromCart(${item.id})">
                            <i class="fas fa-trash"></i> Удалить
                        </button>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = `
            <div class="timer-wrapper">
                <div class="timer-card">
                    <i class="fas fa-clock"></i>
                    <span>Бронирование истекает: <span id="cartTimer">--:--</span></span>
                </div>
            </div>
            <div class="cart-grid">
                ${itemsHtml}
            </div>
            <div class="cart-summary-card">
                <div class="summary-row total">
                    <span>Итого к оплате:</span>
                    <span class="value">${cart.total.toLocaleString()} ₽</span>
                </div>
                <div class="cart-actions">
                    <a href="flights.html" class="secondary-btn"><i class="fas fa-arrow-left"></i> Продолжить покупки</a>
                    <a href="order.html" class="main-btn">Оформить заказ <i class="fas fa-arrow-right"></i></a>
                </div>
            </div>
        `;
        initCartTimer();
    }
    
    renderCart();
    if (typeof updateCartCount === 'function') updateCartCount();
    
    window.addEventListener('storage', (e) => {
        if (e.key === 'aviakassa_cart') { renderCart(); if (typeof updateCartCount === 'function') updateCartCount(); }
    });
</script>
</body>
</html>
